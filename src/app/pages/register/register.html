<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span>MindTrap</span>
    </div>
    
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join us and master competitive programming.</p>

    <div *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="username" [(ngModel)]="registerData.username" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="registerData.email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="registerData.password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>

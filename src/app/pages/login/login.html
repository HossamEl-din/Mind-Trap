<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span>MindTrap</span>
    </div>
    
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Log in to continue your learning journey.</p>

    <div *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
